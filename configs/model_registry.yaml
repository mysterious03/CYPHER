# CYPhER Model Registry Configuration (V2.5.0)
# Single Source of Truth for all 15 perception capabilities

system:
  project_name: "CYPhER Road Perception & Hazard Intelligence System"
  version: "2.5.0"
  device: "cuda"
  max_vram_gb: 6.0
  safety_headroom_gb: 1.0

models:
  damage:
    id: "M1_ROAD_DAMAGE"
    name: "Custom YOLO26n Road Damage Detector"
    task: "detect"
    architecture: "YOLO26n"
    checkpoint: "runs/detect/road_damage_v25/weights/best.pt"
    fallback_checkpoint: "runs/detect/road_damage_v22/weights/best.pt"
    classes:
      0: "D00_longitudinal_crack"
      1: "D10_transverse_crack"
      2: "D20_alligator_crack"
      3: "D40_pothole"
    input_size: [640, 640]
    default_conf: 0.25
    default_iou: 0.45
    status: "VALIDATED_ACCEPTABLE"
    metrics:
      full_val_images: 1172
      standalone_precision: 56.71
      standalone_recall: 40.38
      standalone_f1: 47.17
      adaptive_fast_precision: 66.91
      adaptive_fast_recall: 37.28
      adaptive_fast_f1: 47.88
      adaptive_balanced_precision: 61.40
      adaptive_balanced_recall: 42.40
      adaptive_balanced_f1: 50.16
      adaptive_high_acc_recall: 49.26
      adaptive_high_acc_small_recall: 14.29
      d00_recall_retrained: 30.40
      d20_recall_retrained: 61.90
      d40_recall_retrained: 41.50
      d10_map50: 0.00207

  surface:
    id: "M2_SURFACE_CLASSIFIER"
    name: "Multi-Task Surface Condition Classifier"
    task: "classification"
    architecture: "MobileNetV3-Small Multi-Task"
    checkpoint: "runs/surface_classifier_v25/best_surface_model.pt"
    heads:
      friction: ["Dry", "Wet", "Water-covered", "Fresh snow", "Melted snow", "Ice-covered"]
      material: ["Asphalt", "Concrete", "Gravel", "Dirt", "Mud", "Loose stone"]
      unevenness: ["Smooth", "Slightly uneven", "Severely uneven", "Deteriorated"]
    input_size: [224, 224]
    default_conf: 0.30
    status: "VALIDATED_STRONG"
    metrics:
      full_val_patches: 1172
      mean_accuracy: 98.04
      friction_balanced_accuracy: 98.58
      friction_macro_f1: 65.61
      wet_recall: 100.00
      material_accuracy: 100.00
      material_macro_f1: 100.00
      unevenness_balanced_accuracy: 96.95
      unevenness_macro_f1: 88.20
      uneven_recall: 96.97
      training_strategy: "Class-Balanced Effective Number (beta=0.999)"

  water:
    id: "M3_WATER_SEG"
    name: "LRASPP MobileNetV3 Road Waterlogging Segmenter"
    task: "segmentation"
    architecture: "LRASPP MobileNetV3-Large"
    checkpoint: "runs/water_segmenter/best_water_model.pt"
    classes:
      0: "dry_road"
      1: "standing_water_flood"
      2: "water_puddle"
      3: "specular_wet_reflection"
    input_size: [512, 512]
    default_conf: 0.40
    status: "DATASET_REQUIRED"
    annotation: "Synthetic pseudo-masks quarantined; authentic pixel-level benchmark ingestion required"

  vehicles:
    id: "M4_VEHICLE_SEG"
    name: "YOLO26n Vehicle Instance Segmenter & Tracker"
    task: "segment"
    architecture: "YOLO26n-seg"
    checkpoint: "yolo26n-seg.pt"
    classes:
      0: "person"
      1: "bicycle"
      2: "car"
      3: "motorcycle"
      5: "bus"
      7: "truck"
    input_size: [640, 640]
    default_conf: 0.35
    tracker: "bytetrack"
    status: "PRETRAINED_NOT_VALIDATED"
    annotation: "COCO weights miss 3-wheelers (auto-rickshaws) and tractors; IDD fine-tuning blueprint prepared"

  road_scene:
    id: "M5_SCENE_SEM"
    name: "YOLO26n Scene Semantic Segmenter"
    task: "semantic"
    architecture: "YOLO26n-sem"
    checkpoint: "yolo26n-sem.pt"
    classes:
      0: "road"
      1: "sidewalk"
      2: "building"
      3: "wall"
      4: "fence"
      5: "pole"
      6: "traffic_light"
      7: "traffic_sign"
      8: "vegetation"
      9: "terrain"
      10: "sky"
      11: "person"
      12: "rider"
      13: "car"
      14: "truck"
      15: "bus"
      16: "train"
      17: "motorcycle"
      18: "bicycle"
    input_size: [640, 640]
    default_conf: 0.25
    status: "PRETRAINED_NOT_VALIDATED"

  depth:
    id: "M6_MONOCULAR_DEPTH"
    name: "YOLO26n Monocular Depth Estimator"
    task: "depth"
    architecture: "YOLO26n-depth"
    checkpoint: "yolo26n-depth.pt"
    classes:
      0: "depth"
    input_size: [640, 640]
    measurement_type: "relative"
    status: "CALIBRATION_REQUIRED"

  lanes:
    id: "M7_LANE_DETECTION"
    name: "Dedicated Polyline Lane & Marking Detector"
    task: "lane_detection"
    architecture: "MobileNetV3 Row-wise Anchor Polyline Model"
    checkpoint: "runs/lane_detector_v22/best_lane_model.pt"
    classes:
      0: "solid_white"
      1: "dashed_white"
      2: "solid_yellow"
      3: "double_yellow"
      4: "unmarked_edge"
    status: "TRAINED_NOT_VALIDATED"

  weather:
    id: "M8_WEATHER_CLASSIFIER"
    name: "Multi-Task Environmental Weather & Lighting Classifier"
    task: "classification"
    architecture: "MobileNetV3-Small Dual-Head"
    checkpoint: "runs/weather_classifier_v22/best_weather_model.pt"
    classes:
      weather: ["Clear", "Rain", "Fog", "Snow", "Overcast"]
      lighting: ["Daytime", "Nighttime", "Dawn_Dusk"]
    status: "TRAINED_NOT_VALIDATED"

  traffic_signals:
    id: "M9_TRAFFIC_SIGNALS"
    name: "Traffic Signal Detection & Hybrid State Classifier"
    task: "detection_and_classification"
    architecture: "YOLO26n Box + Patch CNN Classifier with Optical HSV Fallback"
    checkpoint: "runs/traffic_signals_v22/best_signal_model.pt"
    classes:
      0: "red"
      1: "amber_yellow"
      2: "green"
      3: "unknown_or_off"
    status: "VALIDATED_STRONG"
    annotation: "Optical HSV vertical thirds rule validated (100% state precision); patch CNN gated as DATASET_REQUIRED"

  obstacles:
    id: "M10_OBSTACLES"
    name: "Open-Vocabulary Zero-Shot Road Obstacle Perception"
    task: "open_vocabulary_detection"
    architecture: "YOLO-World (yolov8s-world.pt) Text-Prompted Model"
    checkpoint: "yolov8s-world.pt"
    prompts:
      - "fallen tree"
      - "large rock"
      - "boulder on road"
      - "road debris"
      - "broken concrete"
      - "spilled cargo"
      - "tyre on road"
      - "construction material"
      - "traffic barrier"
      - "road obstruction"
    status: "PRETRAINED_NOT_VALIDATED"

  accident:
    id: "M11_ACCIDENT_INTELLIGENCE"
    name: "Temporal Video Accident & Anomaly Engine"
    task: "video_action_recognition"
    architecture: "16-Frame Spatio-Temporal 3D-CNN + Trajectory Tracking"
    classes:
      0: "normal_traffic"
      1: "hard_braking_near_miss"
      2: "vehicle_collision"
      3: "vehicle_rollover_or_jackknife"
    status: "HEURISTIC_BASELINE"
    annotation: "Heuristic tracker active; 3D ST-GCN awaiting DADA-2000 dataset (DATASET_REQUIRED)"

  pothole_geometry:
    id: "M12_POTHOLE_GEOMETRY"
    name: "Calibrated Pothole Dimensions & Depth"
    task: "geometric_measurement"
    output_type: "RELATIVE_DIMENSIONS_AND_DEPTH"
    calibration_requirements: ["camera_height_m", "pitch_angle_deg", "focal_length_px", "intrinsic_matrix"]
    status: "CALIBRATION_REQUIRED"

  friction:
    id: "M13_FRICTION_ESTIMATE"
    name: "Sensor-Assisted Tyre-Road Friction Estimation"
    task: "sensor_fusion_estimation"
    output_type: "VISUAL_SLIP_RISK_ESTIMATE"
    required_sensors: ["wheel_speed", "vehicle_speed", "imu_acceleration", "yaw_rate"]
    status: "SENSOR_REQUIRED"

  roughness:
    id: "M14_ROUGHNESS_IRI"
    name: "Sensor-Assisted Road Roughness & IRI"
    task: "sensor_fusion_estimation"
    output_type: "VISUAL_ROUGHNESS_CLASS"
    required_sensors: ["accelerometer_vertical", "vehicle_speed", "gyroscope"]
    status: "SENSOR_REQUIRED"

  master_fusion:
    id: "M15_ALL_HAZARDS"
    name: "Unified Multi-Model Hazard Intelligence Orchestrator"
    task: "hazard_fusion"
    status: "VALIDATED_ACCEPTABLE"
